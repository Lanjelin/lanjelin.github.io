name: Build and deploy Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate site data
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          STRICT_SITE_DATA: "true"
        run: node tools/generate-site-data.mjs

      - name: Validate generated site data
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('data/site.json', 'utf8'));
          const packages = Array.isArray(data.packages) ? data.packages : [];
          const expectedNames = [
            'openaudible-docker',
            'tor-zero',
            'monerod-zero',
            'nvim-docker',
            'proton-bridge-rootless',
            'handl',
          ];
          const hasPlaceholder = packages.some((entry) => {
            const text = `${entry?.name || ''} ${entry?.description || ''} ${entry?.statsText || ''}`;
            return (
              text.includes('GHCR artifact · repo-backed') ||
              text.includes('Profile packages: 30') ||
              text.includes('Public package listings were not available from the API') ||
              text.includes('GitHub Packages')
            );
          });

          if (hasPlaceholder) {
            throw new Error('Generated site data still contains placeholder package entries.');
          }

          const names = packages.map((entry) => String(entry?.name || ''));
          const orderMatches = expectedNames.every((name, index) => names[index] === name);
          if (!orderMatches || packages.length !== expectedNames.length) {
            throw new Error('Generated site data does not match the requested package order.');
          }

          const labelsMatch = packages.every((entry) => String(entry?.chip || '') === 'published' && /^Last updated/.test(String(entry?.statsText || '')));
          if (!labelsMatch) {
            throw new Error('Generated site data does not have the expected package labels.');
          }

          if (packages.length === 0) {
            throw new Error('Generated site data contains no packages.');
          }
          NODE

      - name: Prepare site
        run: |
          rm -rf dist
          mkdir -p dist/data
          cp index.html script.js styles.css dist/
          cp data/site.json dist/data/site.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
